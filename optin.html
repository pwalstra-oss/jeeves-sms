<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Message Sign-Up</title>
<style>
  :root{color-scheme:light}
  body{max-width:520px;margin:0 auto;padding:2.5rem 1.25rem 4rem;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff}
  h1{font-size:1.6rem;margin:.2rem 0 .3rem}
  p.sub{color:#555;margin-top:0}
  label{display:block;font-weight:600;margin:1.25rem 0 .35rem}
  input[type=text],input[type=tel]{width:100%;box-sizing:border-box;padding:.7rem .8rem;font-size:1rem;border:1px solid #c6ccd8;border-radius:8px}
  .consent{display:flex;gap:.6rem;align-items:flex-start;margin:1.4rem 0;padding:1rem;background:#f4f6fb;border:1px solid #dde3ef;border-radius:8px}
  .consent input{margin-top:.25rem;flex:0 0 auto;width:18px;height:18px}
  .consent label{font-weight:400;margin:0;font-size:.92rem;color:#333}
  button{margin-top:1.5rem;width:100%;padding:.8rem;font-size:1rem;font-weight:600;color:#fff;background:#1a56db;border:0;border-radius:8px;cursor:pointer}
  .fine{color:#666;font-size:.8rem;margin-top:1.25rem}
  a{color:#1a56db}
</style>
</head>
<body>
<h1>Text Message Sign-Up</h1>
<p class="sub">Sign up to receive text-message notifications and updates from Peter Walstra.</p>

<form onsubmit="event.preventDefault();document.getElementById('done').hidden=false;this.hidden=true;">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" autocomplete="name" required>

  <label for="phone">Mobile number</label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 555-5555" required>

  <div class="consent">
    <input id="consent" name="consent" type="checkbox" required>
    <label for="consent">I agree to receive text messages from Peter Walstra at the mobile number provided, including appointment confirmations, reminders, status updates, and replies to my questions. Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for help. Consent is not a condition of purchase.</label>
  </div>

  <button type="submit">Sign me up</button>
  <p class="fine">By submitting, you agree to our <a href="terms.html">Terms &amp; Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</p>
</form>

<div id="done" hidden>
  <p><strong>Thank you.</strong> You're signed up to receive text messages from Peter Walstra. Reply STOP at any time to opt out, or HELP for help.</p>
</div>
</body>
</html>
